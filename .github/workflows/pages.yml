name: Deploy to GitHub Pages

# Runs on every push to main that affects the dashboard output files,
# OR manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'Data/Output/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# GitHub Pages needs these permissions on the GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time — newer pushes cancel older queued runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Data/Output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
