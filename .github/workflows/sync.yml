name: Cardiotrack Sync + Deploy

# Runs frequently during India business hours, plus on-demand:
#   UTC 04, 06, 08, 10, 12, 14, 19  →  IST 09:30, 11:30, 13:30, 15:30,
#                                        17:30, 19:30, 00:30
# Extra run at 18:05 UTC = 23:35 IST to pick up the nightly
#   Daily_Insurer_Billing_Data.csv attachment.
# Plus 'Run workflow' button in the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4,6,8,10,12,14,19 * * *'
    - cron: '5 18 * * *'
  workflow_dispatch: {}

# Required for actions/deploy-pages
permissions:
  contents: read
  pages:    write
  id-token: write

# Serialize runs — newer scheduled triggers queue rather than racing
concurrency:
  group: cardiotrack-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet \
            google-auth-oauthlib \
            google-api-python-client \
            openpyxl

      # ── 1. Restore OAuth credentials from secrets ────────────────────────
      - name: Restore OAuth credentials from secrets
        env:
          CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          TOKEN: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          mkdir -p Automation
          printf '%s' "$CREDS" > Automation/credentials.json
          printf '%s' "$TOKEN" > Automation/token.json
          echo "credentials.json: $(wc -c < Automation/credentials.json) bytes"
          echo "token.json:       $(wc -c < Automation/token.json) bytes"

      # ── 2. Restore sync_log.json from the prior run's artifact ───────────
      # This is how dedup state persists across runs without us committing
      # back to main. We use `gh run download` instead of the
      # actions/download-artifact action because the latter exits non-zero
      # (and visually red-flags the step) when no artifact exists yet — true
      # on the first ever run AND any time all prior artifacts have expired.
      # A shell script with explicit fallback exits 0 either way.
      - name: Restore previous sync_log.json (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Automation
          # Find the most recent successful run of this workflow and try to
          # grab its sync_log artifact. Failure is non-fatal.
          if gh run download --name cardiotrack-sync-log --dir Automation/ \
               --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "✓ Restored sync_log.json from previous run"
            ls -la Automation/sync_log.json 2>/dev/null
          else
            echo "ℹ No prior sync_log artifact (first run or all expired) — starting fresh."
            echo '{"processed_message_ids": [], "attachment_hashes": {}, "last_sync": null}' > Automation/sync_log.json
          fi

      # ── 3. Pull Quarter Target.xlsx from Drive + sync from Gmail + rebuild
      - name: Pull Quarter Target.xlsx from Google Drive
        env:
          QUARTER_TARGET_FILE_ID: ${{ secrets.QUARTER_TARGET_FILE_ID }}
        run: python3 Automation/drive_pull.py
        continue-on-error: true   # Drive failure must not block HTML rebuild

      - name: Run sync (Gmail → CSVs → JSON → HTML)
        run: python3 Automation/cardiotrack_sync.py

      # ── 4. Scrub secrets before any further steps run ────────────────────
      - name: Scrub OAuth artefacts
        if: always()
        run: |
          rm -f Automation/credentials.json Automation/token.json
          rm -f "Data/Input/Quarter Target.xlsx"

      # ── 5. Persist sync_log.json for the next run ────────────────────────
      - name: Upload sync_log.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardiotrack-sync-log
          path: Automation/sync_log.json
          retention-days: 90
          overwrite: true
        if: hashFiles('Automation/sync_log.json') != ''

      # ── 6. Deploy directly to GitHub Pages — no git commit, no race ──────
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Data/Output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── 7. Diagnostic summary (always shown in Actions UI) ───────────────
      - name: Workflow summary
        if: always()
        run: |
          echo "## Sync result" >> "$GITHUB_STEP_SUMMARY"
          if [ -f Data/Output/dashboard_data.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 -c "
          import json
          d = json.load(open('Data/Output/dashboard_data.json'))
          out = {
              'generated_at': d['meta'].get('generated_at'),
              'q2_achieved':  d['kpis'].get('q2_achieved'),
              'may_revenue':  d['kpis'].get('may_revenue'),
              'jun_revenue':  d['kpis'].get('jun_revenue'),
              'gmail_status': d['meta'].get('gmail_status', {}),
          }
          print(json.dumps(out, indent=2))" >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
